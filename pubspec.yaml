name: quick_req
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_sizer: ^1.0.5
  flutter_riverpod: ^2.6.1
  flutter_native_splash: ^2.4.4
  get_storage: ^2.1.1
  path_provider: ^2.1.5
  flutter_easyloading: ^3.0.5
  flutter_localization: ^0.3.1
  lottie: ^3.3.1
  swipeable_page_route: ^0.4.6
  flutter_svg: ^2.0.17
  flutter_launcher_icons: ^0.14.3
  file_picker: ^8.1.7
  http: ^1.3.0
  shared_preferences: ^2.4.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/name.png"

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/logo.png
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
    - assets/svgs/
    - assets/lotties/
    - assets/i18n/en.json
    - assets/i18n/fr.json